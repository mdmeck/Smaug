name: Lab runner

# Intraday executor for Lab strategies at status paper/live. Two jobs a day
# because Actions caps a job at 6h and RTH is 6.5h: morning (open -> 12:50 ET)
# and afternoon (12:51 ET -> close).
#
# Not on Actions' own `schedule`: in Oct 2026 those crons fired 4-5.5h late
# every day, after the windows had closed. Instead the "Smaug Lab trigger"
# routine force-pushes an empty commit on top of main to claude/lab-trigger
# at 13:20 UTC weekdays (09:20 EDT / 08:20 EST — the runner sleeps until the
# open), which starts the morning job; the morning job dispatches the
# afternoon one when it ends. A push or dispatch starts within seconds.
#
# Does nothing unless lab_controls.trading_enabled is true AND a strategy is
# at status paper/live: with trading off it still evaluates and records
# signals as status=rejected, which is a free shadow forward-test.
on:
  push:
    branches: [claude/lab-trigger]
  workflow_dispatch:
    inputs:
      window:
        description: "morning | afternoon | auto"
        default: auto
      dry_run:
        description: "evaluate and log only, never order"
        type: boolean
        default: false

concurrency:
  group: lab-runner
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # to dispatch the afternoon job

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas numpy requests yfinance
      - name: Restore bar cache
        uses: actions/cache@v4
        with:
          path: lab/.cache
          key: lab-cache-${{ github.run_id }}
          restore-keys: lab-cache-
      - name: Pick window
        id: w
        run: echo "window=${{ inputs.window || 'morning' }}" >> "$GITHUB_OUTPUT"
      - name: Run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m lab.runner --window ${{ steps.w.outputs.window }} ${{ inputs.dry_run && '--dry-run' || '' }}
      # even if the morning job failed: the afternoon may still have a
      # position to manage. The runner exits on its own on a closed day.
      - name: Start afternoon window
        if: always() && steps.w.outputs.window == 'morning' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run lab-runner.yml --repo "${{ github.repository }}" --ref main -f window=afternoon
