name: Lab spreads

# Credit-spread research checks (docs/lab-credit-spreads-proposal.md):
# synthetic selftest, the lookahead check, and the in-sample cheap gate
# (iron condor at 13:45, real option bars, holdout untouched, with the
# matched random control and cost stress). Output lands in the job log and
# as an artifact.
#
# The spread-probe step places one paper combo order priced where it can't
# fill and cancels it. It runs only when the pushed commit's message says
# [spread-probe] (the trader's yes on 2026-11-17 covered one such order), or
# when started by hand with probe=true. It refuses on anything but the
# paper endpoint.
on:
  push:
    paths: ["lab/spreads.py", "lab/controls.py", "lab/strategies/credit_spread.py",
            ".github/workflows/lab-spreads.yml"]
  workflow_dispatch:
    inputs:
      probe:
        description: "Place and cancel one paper combo order"
        type: boolean
        default: false

jobs:
  spreads:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests yfinance
      - uses: actions/cache@v4
        with:
          path: lab/.cache
          key: lab-cache-${{ github.run_id }}
          restore-keys: lab-cache-
      - run: mkdir -p out
      - name: Spread selftest (synthetic, no keys)
        run: python -m lab.spreads --selftest | tee out/selftest.txt
      - name: Paper combo probe
        if: contains(github.event.head_commit.message, '[spread-probe]') || inputs.probe
        run: python -m lab.research spread-probe | tee out/probe.json
      - name: Lookahead check
        run: python -m lab.research causal credit_spread --start 2025-06-01 --days 10 | tee out/causal.json
      - name: Cheap gate (in-sample only)
        run: |
          python -m lab.research evaluate credit_spread --start 2024-02-15 --end 2026-02-24 \
            --tries 1 --draws 20 --stress --save out/gate_trades.csv | tee out/gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-spreads
          path: out/
